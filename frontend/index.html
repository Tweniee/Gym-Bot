<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RAG Chatbot</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu,
          Cantarell, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
      }

      .container {
        background: white;
        border-radius: 20px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        max-width: 800px;
        width: 100%;
        overflow: hidden;
      }

      .header {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        padding: 30px;
        text-align: center;
      }

      .header h1 {
        font-size: 28px;
        margin-bottom: 10px;
      }

      .header p {
        opacity: 0.9;
        font-size: 14px;
      }

      .content {
        padding: 30px;
      }

      .section {
        margin-bottom: 30px;
      }

      .section h2 {
        font-size: 18px;
        margin-bottom: 15px;
        color: #333;
      }

      .upload-area {
        border: 2px dashed #667eea;
        border-radius: 10px;
        padding: 30px;
        text-align: center;
        cursor: pointer;
        transition: all 0.3s;
      }

      .upload-area:hover {
        background: #f8f9ff;
        border-color: #764ba2;
      }

      .upload-area input[type="file"] {
        display: none;
      }

      .upload-btn {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        border: none;
        padding: 12px 30px;
        border-radius: 25px;
        cursor: pointer;
        font-size: 14px;
        font-weight: 600;
        transition: transform 0.2s;
      }

      .upload-btn:hover {
        transform: translateY(-2px);
      }

      .upload-btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      .chat-area {
        border: 1px solid #e0e0e0;
        border-radius: 10px;
        padding: 20px;
        min-height: 300px;
        max-height: 400px;
        overflow-y: auto;
        background: #f8f9fa;
        margin-bottom: 15px;
      }

      .message {
        margin-bottom: 15px;
        padding: 12px 16px;
        border-radius: 10px;
        max-width: 80%;
      }

      .message.user {
        background: #667eea;
        color: white;
        margin-left: auto;
      }

      .message.bot {
        background: white;
        border: 1px solid #e0e0e0;
      }

      .sources {
        font-size: 12px;
        color: #666;
        margin-top: 8px;
        padding-top: 8px;
        border-top: 1px solid #e0e0e0;
      }

      .input-group {
        display: flex;
        gap: 10px;
      }

      .input-group input {
        flex: 1;
        padding: 12px 16px;
        border: 1px solid #e0e0e0;
        border-radius: 25px;
        font-size: 14px;
        outline: none;
      }

      .input-group input:focus {
        border-color: #667eea;
      }

      .send-btn {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        border: none;
        padding: 12px 30px;
        border-radius: 25px;
        cursor: pointer;
        font-size: 14px;
        font-weight: 600;
        transition: transform 0.2s;
      }

      .send-btn:hover {
        transform: translateY(-2px);
      }

      .send-btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      .status {
        padding: 10px;
        border-radius: 5px;
        margin-bottom: 15px;
        font-size: 14px;
      }

      .status.success {
        background: #d4edda;
        color: #155724;
        border: 1px solid #c3e6cb;
      }

      .status.error {
        background: #f8d7da;
        color: #721c24;
        border: 1px solid #f5c6cb;
      }

      .status.info {
        background: #d1ecf1;
        color: #0c5460;
        border: 1px solid #bee5eb;
      }

      .loading {
        display: inline-block;
        width: 20px;
        height: 20px;
        border: 3px solid #f3f3f3;
        border-top: 3px solid #667eea;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }

      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h1>🤖 RAG Chatbot</h1>
        <p>Upload documents and ask questions</p>
      </div>

      <div class="content">
        <!-- Upload Section -->
        <div class="section">
          <h2>📄 Upload Document</h2>
          <div id="uploadStatus"></div>
          <div
            class="upload-area"
            onclick="document.getElementById('fileInput').click()"
          >
            <p>📁 Click to select a file</p>
            <p style="font-size: 12px; color: #666; margin-top: 10px">
              Supported: .txt, .md, .pdf, .csv (max 10MB)
            </p>
            <input type="file" id="fileInput" accept=".txt,.md,.pdf,.csv" />
          </div>
          <div style="text-align: center; margin-top: 15px">
            <button class="upload-btn" id="uploadBtn" onclick="uploadFile()">
              Upload Document
            </button>
          </div>
        </div>

        <!-- Chat Section -->
        <div class="section">
          <h2>💬 Ask Questions</h2>
          <div class="chat-area" id="chatArea"></div>
          <div class="input-group">
            <input
              type="text"
              id="questionInput"
              placeholder="Ask a question about your documents..."
              onkeypress="if (event.key === 'Enter') askQuestion();"
            />
            <button class="send-btn" id="sendBtn" onclick="askQuestion()">
              Send
            </button>
          </div>
        </div>
      </div>
    </div>

    <script>
      const API_BASE = "http://localhost:3000/api";
      let selectedFile = null;

      // File selection
      document.getElementById("fileInput").addEventListener("change", (e) => {
        selectedFile = e.target.files[0];
        if (selectedFile) {
          showStatus("uploadStatus", `Selected: ${selectedFile.name}`, "info");
        }
      });

      // Upload file
      async function uploadFile() {
        if (!selectedFile) {
          showStatus("uploadStatus", "Please select a file first", "error");
          return;
        }

        const uploadBtn = document.getElementById("uploadBtn");
        uploadBtn.disabled = true;
        uploadBtn.innerHTML = '<span class="loading"></span> Uploading...';

        const formData = new FormData();
        formData.append("file", selectedFile);

        try {
          const response = await fetch(`${API_BASE}/ingest`, {
            method: "POST",
            body: formData,
          });

          const data = await response.json();

          if (data.success) {
            showStatus(
              "uploadStatus",
              `✓ Successfully uploaded ${data.filename} (${data.chunks} chunks)`,
              "success",
            );
            selectedFile = null;
            document.getElementById("fileInput").value = "";
          } else {
            showStatus(
              "uploadStatus",
              `✗ Upload failed: ${data.error}`,
              "error",
            );
          }
        } catch (error) {
          showStatus(
            "uploadStatus",
            `✗ Upload failed: ${error.message}`,
            "error",
          );
        } finally {
          uploadBtn.disabled = false;
          uploadBtn.textContent = "Upload Document";
        }
      }

      // Ask question
      async function askQuestion() {
        const input = document.getElementById("questionInput");
        const question = input.value.trim();

        if (!question) return;

        // Add user message
        addMessage(question, "user");
        input.value = "";

        const sendBtn = document.getElementById("sendBtn");
        sendBtn.disabled = true;
        sendBtn.innerHTML = '<span class="loading"></span>';

        try {
          const response = await fetch(`${API_BASE}/chat`, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({ question }),
          });

          const data = await response.json();

          if (response.ok) {
            addMessage(data.answer, "bot", data.sources);
          } else {
            addMessage(`Error: ${data.error}`, "bot");
          }
        } catch (error) {
          addMessage(`Error: ${error.message}`, "bot");
        } finally {
          sendBtn.disabled = false;
          sendBtn.textContent = "Send";
        }
      }

      // Add message to chat
      function addMessage(text, sender, sources = []) {
        const chatArea = document.getElementById("chatArea");
        const messageDiv = document.createElement("div");
        messageDiv.className = `message ${sender}`;

        let html = `<div>${text}</div>`;

        if (sources && sources.length > 0) {
          html += `<div class="sources">📚 Sources: ${sources.join(", ")}</div>`;
        }

        messageDiv.innerHTML = html;
        chatArea.appendChild(messageDiv);
        chatArea.scrollTop = chatArea.scrollHeight;
      }

      // Show status message
      function showStatus(elementId, message, type) {
        const statusDiv = document.getElementById(elementId);
        statusDiv.className = `status ${type}`;
        statusDiv.textContent = message;
        statusDiv.style.display = "block";

        if (type === "success" || type === "info") {
          setTimeout(() => {
            statusDiv.style.display = "none";
          }, 5000);
        }
      }

      // Check health on load
      window.addEventListener("load", async () => {
        try {
          const response = await fetch(`${API_BASE}/health`);
          const data = await response.json();

          if (data.status === "healthy") {
            addMessage(
              "👋 Hello! Upload a document and ask me questions about it.",
              "bot",
            );
          } else {
            addMessage(
              "⚠️ System is not fully operational. Please check the backend.",
              "bot",
            );
          }
        } catch (error) {
          addMessage(
            "❌ Cannot connect to backend. Please ensure the server is running.",
            "bot",
          );
        }
      });
    </script>
  </body>
</html>
